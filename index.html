<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ABDM Obtainable Tier List</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root{
    --bg: #0a0d10;
    --panel: #10151a;
    --panel-line: #1e262d;
    --text: #e6ecef;
    --text-dim: #6f8089;
    --rising: #4fa8e0;
    --stable: #2fd06e;
    --new: #ffa93a;
    --gatekept: #3adfc0;
    --inflated: #d879e8;
    --struggling: #ff4d5e;
    --unstable: #b675e0;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'JetBrains Mono',monospace;}
  .display{font-family:'Oswald',sans-serif;}

  /* ---- ticker ---- */
  .ticker-wrap{ background:#000; border-bottom:1px solid var(--panel-line); overflow:hidden; white-space:nowrap; padding:8px 0; }
  .ticker{ display:inline-block; animation: scroll 65s linear infinite; padding-left:100%; }
  .ticker-wrap:hover .ticker{ animation-play-state: paused; }
  @keyframes scroll{ 0%{transform:translateX(0);} 100%{transform:translateX(-100%);} }
  .tick{ display:inline-flex; align-items:center; gap:6px; margin-right:34px; font-size:13px; }
  .tick .tname{color:var(--text); font-weight:700;}
  .tick .tval{color:var(--text-dim);}

  /* ---- alert banner ---- */
  .alert{
    background:linear-gradient(180deg, #1a1008, #120c07);
    border-bottom:1px solid #3a2413;
    padding:14px 24px;
    font-size:12px;
    line-height:1.8;
    color:#f0c98a;
  }
  .alert a{ color:#ffce6b; font-weight:700; }

  /* ---- header ---- */
  header{
    padding:34px 24px 20px;
    border-bottom:1px solid var(--panel-line);
    background:
      radial-gradient(1200px 300px at 15% -10%, rgba(47,208,110,0.08), transparent),
      radial-gradient(900px 260px at 90% -20%, rgba(217,121,232,0.07), transparent);
  }
  .eyebrow{ color:var(--text-dim); font-size:12px; letter-spacing:3px; text-transform:uppercase; margin-bottom:10px; }
  h1{ font-family:'Oswald',sans-serif; font-size:clamp(28px,5vw,46px); font-weight:700; letter-spacing:1px; margin:0 0 6px; text-transform:uppercase; }
  h1 span{ color:var(--stable); }
  .maker{
    margin-top:16px; display:inline-flex; align-items:center; gap:8px;
    font-family:'Oswald',sans-serif; font-size:12px; letter-spacing:1.5px; text-transform:uppercase;
    color:var(--text-dim); border:1px solid var(--panel-line); background:rgba(255,255,255,0.02);
    padding:7px 14px 7px 7px; border-radius:30px;
  }
  .maker b{ color:#0a0d10; background:#eef1f3; font-size:12px; letter-spacing:.5px; padding:4px 12px; border-radius:22px; font-weight:700; }

  main{ max-width:1180px; margin:0 auto; padding:28px 20px 80px; }

  .section-head{ display:flex; align-items:baseline; gap:10px; margin:34px 0 12px; }
  .section-head .display{ font-size:15px; letter-spacing:2px; text-transform:uppercase; font-weight:600; }

  .tier-row{ display:flex; border:1px solid var(--panel-line); border-radius:10px; overflow:hidden; margin-bottom:14px; background:var(--panel); }
  .tier-label{ flex:0 0 68px; display:flex; align-items:center; justify-content:center; font-family:'Oswald',sans-serif; font-size:30px; font-weight:700; color:#0a0d10; }
  .tier-X .tier-label{ background:linear-gradient(160deg,#ff4d5e,#c81e35); }
  .tier-S .tier-label{ background:linear-gradient(160deg,#ffa93a,#d67d10); }
  .tier-A .tier-label{ background:linear-gradient(160deg,#ffd83a,#d6a90f); }
  .tier-B .tier-label{ background:linear-gradient(160deg,#8ee04a,#4bab1c); }
  .tier-C .tier-label{ background:linear-gradient(160deg,#3adfc0,#0f9c86); }
  .tier-ARROW .tier-label{ background:linear-gradient(160deg,#4fa8e0,#1f6aa8); font-size:14px; letter-spacing:1px; }
  .tier-items{ flex:1; display:flex; flex-wrap:wrap; gap:10px; padding:14px; min-height:20px; }
  .tier-items:empty::after{ content:"No stands added yet"; color:var(--text-dim); font-size:11px; font-style:italic; padding:4px; }

  .item{
    background:#0d1216; border:1px solid var(--panel-line); border-left:3px solid var(--stable);
    border-radius:8px; padding:9px 12px; min-width:160px; cursor:pointer;
    transition: transform .12s ease, border-color .12s ease;
  }
  .item:hover{ transform: translateY(-2px); border-color:#33424c; }
  .item img{ width:100%; border-radius:6px; margin-bottom:6px; display:block; object-fit:cover; max-height:120px; }
  .item .name{ font-family:'Oswald',sans-serif; font-size:14px; font-weight:600; letter-spacing:.4px; text-transform:uppercase; margin-bottom:2px; }
  .item .abbr{ font-size:10px; color:var(--text-dim); margin-bottom:6px; }
  .item .meta{ display:flex; align-items:center; justify-content:space-between; gap:6px; font-size:11px; flex-wrap:wrap; }
  .item .demand{ color:var(--text); font-weight:700; }
  .badges{ display:flex; gap:4px; flex-wrap:wrap; }
  .trend{ padding:2px 7px; border-radius:20px; font-size:9.5px; letter-spacing:.4px; text-transform:uppercase; font-weight:700; }
  .t-stable{ background:rgba(47,208,110,.15); color:var(--stable); }
  .t-rising{ background:rgba(79,168,224,.15); color:var(--rising); }
  .t-new{ background:rgba(255,169,58,.15); color:var(--new); }
  .t-gatekept{ background:rgba(58,223,192,.15); color:var(--gatekept); }
  .t-inflated{ background:rgba(216,121,232,.15); color:var(--inflated); }
  .t-struggling{ background:rgba(255,77,94,.15); color:var(--struggling); }
  .t-unstable{ background:rgba(182,117,224,.15); color:var(--unstable); }

  .betas .tier-label{ background:linear-gradient(160deg,#5c6670,#333c45); font-size:14px; letter-spacing:1px; }

  .modal-overlay{ display:none; position:fixed; inset:0; background:rgba(4,6,8,0.72); backdrop-filter:blur(2px); z-index:50; align-items:center; justify-content:center; padding:20px; }
  .modal-overlay.open{ display:flex; }
  .modal{ background:var(--panel); border:1px solid var(--panel-line); border-radius:12px; max-width:460px; width:100%; padding:22px 24px 24px; position:relative; box-shadow:0 20px 60px rgba(0,0,0,0.5); max-height:80vh; overflow-y:auto; }
  .modal img{ width:100%; border-radius:8px; margin-bottom:14px; }
  .modal-close{ position:absolute; top:14px; right:16px; background:none; border:none; color:var(--text-dim); font-size:18px; cursor:pointer; line-height:1; }
  .modal-close:hover{ color:var(--text); }
  .modal-name{ font-family:'Oswald',sans-serif; font-size:22px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; margin:0 0 2px; }
  .modal-abbr{ font-size:11px; color:var(--text-dim); margin-bottom:12px; }
  .modal-stats{ display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
  .modal-demand{ font-family:'JetBrains Mono',monospace; font-size:18px; font-weight:700; }
  .modal-tier{ font-size:11px; color:var(--text-dim); letter-spacing:.5px; text-transform:uppercase; border:1px solid var(--panel-line); border-radius:6px; padding:2px 8px; }
  .modal-note{ font-size:13px; line-height:1.7; color:var(--text); border-top:1px solid var(--panel-line); padding-top:14px; white-space:pre-line; }

  footer{ text-align:center; color:var(--text-dim); font-size:11px; padding:20px; border-top:1px solid var(--panel-line); }

  @media (max-width:600px){
    .tier-row{ flex-direction:column; }
    .tier-label{ flex:none; width:100%; height:34px; font-size:20px; }
  }
</style>
</head>

<div class="ticker-wrap"><div class="ticker" id="ticker"></div></div>

<div class="alert">

<main>

</main>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">

    <div class="modal-abbr" id="modalAbbr"></div>

      <div class="badges" id="modalTrends"></div>
    </div>
    <div class="modal-note" id="modalNote"></div>
  </div>
</div>

<footer>Credit: <strong style="color:var(--text);">Cookie</strong></footer>

  { tier:"S", items:[] },
  { tier:"A", items:[] },
  { tier:"B", items:[] },
  { tier:"C", items:[] },
  { tier:"ARROW", items:[] },
];

const betas = [];

// ---- modal ----
const overlay = document.getElementById('modalOverlay');
const modalImg = document.getElementById('modalImg');
const modalName = document.getElementById('modalName');
const modalAbbr = document.getElementById('modalAbbr');
const modalDemand = document.getElementById('modalDemand');
const modalTier = document.getElementById('modalTier');
const modalTrends = document.getElementById('modalTrends');
const modalNote = document.getElementById('modalNote');

function openModal(item, tierLabel){
  if(item.img){ modalImg.src = item.img; modalImg.style.display = 'block'; }
  else{ modalImg.style.display = 'none'; }
  modalName.textContent = item.name;
  modalAbbr.textContent = item.abbr || '';
  modalDemand.textContent = item.pts || '';
  modalTier.textContent = tierLabel;
  modalTrends.innerHTML = (item.trends || []).map(trendBadge).join('');
  modalNote.textContent = item.note || 'No additional notes.';
  overlay.classList.add('open');
}
document.getElementById('modalClose').addEventListener('click', ()=> overlay.classList.remove('open'));
overlay.addEventListener('click', (e)=>{ if(e.target === overlay) overlay.classList.remove('open'); });
document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') overlay.classList.remove('open'); });

const tierColors = { X:"#ff4d5e", S:"#ffa93a", A:"#ffd83a", B:"#8ee04a", C:"#3adfc0", ARROW:"#4fa8e0", BETA:"#8a97a1" };

function buildItem(it, tierLabel, accentColor){
  const el = document.createElement('div');
  el.className = 'item';
  el.style.borderLeftColor = accentColor || 'var(--stable)';
  el.innerHTML = `
    ${it.img ? `<img src="${it.img}" loading="lazy">` : ''}
    <div class="name">${it.name}</div>
    ${it.abbr ? `<div class="abbr">${it.abbr}</div>` : ''}
    <div class="meta">
      <span class="demand">${it.pts || ''}</span>
      <span class="badges">${(it.trends || []).map(trendBadge).join('')}</span>
    </div>`;
  el.addEventListener('click', ()=> openModal(it, tierLabel));
  return el;
}

// tiers
const tiersEl = document.getElementById('tiers');
tiers.forEach(t=>{
  const row = document.createElement('div');
  row.className = `tier-row tier-${t.tier}`;
  const label = document.createElement('div');
  label.className = 'tier-label';
  label.textContent = t.tier;
  const itemsWrap = document.createElement('div');
  itemsWrap.className = 'tier-items';
  t.items.forEach(it => itemsWrap.appendChild(buildItem(it, `${t.tier} Tier`, tierColors[t.tier])));
  row.appendChild(label);
  row.appendChild(itemsWrap);
  tiersEl.appendChild(row);
});

// betas
const betasEl = document.getElementById('betas');
const betaRow = document.createElement('div');
betaRow.className = 'tier-row betas';
const betaLabel = document.createElement('div');
betaLabel.className = 'tier-label';
betaLabel.textContent = 'BETA';
const betaItemsWrap = document.createElement('div');
betaItemsWrap.className = 'tier-items';
betas.forEach(it => betaItemsWrap.appendChild(buildItem(it, 'Betas', tierColors.BETA)));
betaRow.appendChild(betaLabel);
betaRow.appendChild(betaItemsWrap);
betasEl.appendChild(betaRow);


// ticker
const tickerEl = document.getElementById('ticker');
const allItems = [...tiers.flatMap(t=>t.items), ...betas];
let tickerHTML = "";
allItems.forEach(it=>{
  tickerHTML += `<span class="tick"><span class="tname">${it.name.toUpperCase()}</span><span class="tval">${it.pts || ''} ${(it.trends||[]).length ? '· ' + it.trends.join('/') : ''}</span></span>`;
});
tickerEl.innerHTML = allItems.length ? (tickerHTML + tickerHTML) : '<span class="tick"><span class="tname">Waiting on stands...</span></span>';
</script>

</body>
</html>
